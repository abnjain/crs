name: Deploy Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deploy target
        required: false
        default: render
        type: choice
        options:
          - render
          - k8s

permissions:
  contents: read

env:
  # CI-only local tag. Render prod builds ./Dockerfile on the deploy hook — no registry push.
  IMAGE_UNIFIED_CI: crs-unified:latest

jobs:
  validate_target:
    runs-on: ubuntu-latest
    outputs:
      deploy_target: ${{ steps.resolve.outputs.deploy_target }}
    steps:
      - name: Resolve DEPLOY_TARGET
        id: resolve
        env:
          INPUT_TARGET: ${{ github.event.inputs.deploy_target }}
          TARGET_VAR: ${{ vars.DEPLOY_TARGET }}
          TARGET_SECRET: ${{ secrets.DEPLOY_TARGET }}
        run: |
          TARGET="${INPUT_TARGET:-}"
          if [ -z "$TARGET" ]; then
            TARGET="${TARGET_VAR:-}"
          fi
          if [ -z "$TARGET" ]; then
            TARGET="${TARGET_SECRET:-}"
          fi
          TARGET="$(printf '%s' "$TARGET" | tr '[:upper:]' '[:lower:]' | xargs)"
          if [ -z "$TARGET" ]; then
            TARGET="render"
            echo "DEPLOY_TARGET not set; defaulting to render"
          fi
          case "$TARGET" in
            render|k8s)
              echo "deploy_target=$TARGET" >> "$GITHUB_OUTPUT"
              echo "Deploy target: $TARGET"
              ;;
            *)
              echo "DEPLOY_TARGET is invalid: '$TARGET'"
              echo "Set repository Variable OR Secret named DEPLOY_TARGET to exactly: render or k8s"
              echo "GitHub → repo Settings → Secrets and variables → Actions"
              exit 1
              ;;
          esac

  ci:
    runs-on: ubuntu-latest
    needs: validate_target
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Client lint and build
        working-directory: client
        run: |
          npm ci
          npm run lint
          npx vite build
      - name: Server build
        working-directory: server
        run: |
          npm ci
          npx tsc --noEmitOnError false
          test -f dist/server.js
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify unified Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_UNIFIED_CI }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_render:
    runs-on: ubuntu-latest
    needs: [validate_target, ci]
    if: needs.validate_target.outputs.deploy_target == 'render'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is required when DEPLOY_TARGET=render"
            echo "Render Dashboard → crs service → Settings → Deploy Hook → copy URL"
            exit 1
          fi
          echo "Triggering Render deploy hook..."
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deploy triggered successfully."

  deploy_k8s:
    runs-on: ubuntu-latest
    needs: [validate_target, ci]
    if: needs.validate_target.outputs.deploy_target == 'k8s'
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_API: ghcr.io/${{ github.repository_owner }}/crs-api
      IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/crs-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/Dockerfile
          push: true
          sbom: true
          provenance: true
          tags: |
            ${{ env.IMAGE_API }}:prod-${{ github.sha }}
            ${{ env.IMAGE_API }}:prod
      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: client
          file: client/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          sbom: true
          provenance: true
          tags: |
            ${{ env.IMAGE_WEB }}:prod-${{ github.sha }}
            ${{ env.IMAGE_WEB }}:prod
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_API }}:prod-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Scan web image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_WEB }}:prod-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_PROD: ${{ secrets.KUBE_CONFIG_PROD }}
        run: |
          if [ -z "$KUBE_CONFIG_PROD" ]; then
            echo "KUBE_CONFIG_PROD secret is required when DEPLOY_TARGET=k8s"
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_PROD" | base64 -d > ~/.kube/config
      - name: Apply manifests
        env:
          K8S_OVERLAY_PROD: ${{ secrets.K8S_OVERLAY_PROD }}
        run: |
          if [ -z "$K8S_OVERLAY_PROD" ]; then
            echo "K8S_OVERLAY_PROD secret is required when DEPLOY_TARGET=k8s"
            exit 1
          fi
          kubectl apply -k "$K8S_OVERLAY_PROD"
      - name: Update images
        env:
          K8S_NAMESPACE_PROD: ${{ secrets.K8S_NAMESPACE_PROD }}
        run: |
          if [ -z "$K8S_NAMESPACE_PROD" ]; then
            echo "K8S_NAMESPACE_PROD secret is required when DEPLOY_TARGET=k8s"
            exit 1
          fi
          kubectl -n "$K8S_NAMESPACE_PROD" set image deployment/crs-api api=${{ env.IMAGE_API }}:prod-${{ github.sha }}
          kubectl -n "$K8S_NAMESPACE_PROD" set image deployment/crs-web web=${{ env.IMAGE_WEB }}:prod-${{ github.sha }}
      - name: Wait for rollout
        env:
          K8S_NAMESPACE_PROD: ${{ secrets.K8S_NAMESPACE_PROD }}
        run: |
          kubectl -n "$K8S_NAMESPACE_PROD" rollout status deployment/crs-api
          kubectl -n "$K8S_NAMESPACE_PROD" rollout status deployment/crs-web
