apiVersion: v1
kind: ConfigMap
metadata:
  name: crs-app-config
data:
  NODE_ENV: "production"
  PORT: "5000"
  API_PREFIX: "/api"
  APP_NAME: "CRS"
  JWT_ALG: "RS256"
  JWT_EXPIRES_IN: "7d"
  AUTH_COOKIE_NAME: "crs_token"
  AUTH_COOKIE_MAX_AGE_MS: "604800000"
  COOKIE_DOMAIN: ""
  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: "lax"
  CSRF_COOKIE_NAME: "crs_csrf"
  CSRF_HEADER_NAME: "x-csrf-token"
  CSRF_TOKEN_BYTES: "32"
  CORS_ORIGINS: "https://crs.example.com"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_AUTH_WINDOW_MS: "900000"
  RATE_LIMIT_AUTH_MAX: "20"
  LOG_LEVEL: "info"
  AUDIT_CONSOLE_LOGS: "false"
  UPLOAD_DIR: "/var/uploads"
  UPLOAD_PROVIDER: "local"
  MAX_UPLOAD_SIZE_MB: "10"
  S3_REGION: "us-east-1"
  S3_ENDPOINT: ""
  S3_SIGNED_URL_EXPIRES: "3600"
  SMTP_PORT: "587"
  SMTP_VERIFY_TIMEOUT_MS: "10000"
  SMTP_PROBE_CACHE_MS: "60000"
  SMTP_CONNECTION_TIMEOUT_MS: "10000"
  SMTP_GREETING_TIMEOUT_MS: "10000"
  SMTP_SOCKET_TIMEOUT_MS: "10000"
  SMTP_REQUIRE_TLS: "false"
  SMTP_POOL: "false"
  SMTP_MAX_CONNECTIONS: "5"
  SMTP_MAX_MESSAGES: "100"
  LANDING_LIBRARY_VOLUMES: "8200"
  LANDING_FOUNDING_YEAR: "1987"
