apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-restore
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        crs-access: db
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: crs-backups
      initContainers:
        - name: fetch
          image: minio/mc:latest
          envFrom:
            - configMapRef:
                name: crs-app-config
            - secretRef:
                name: crs-app-secrets
          env:
            - name: RESTORE_FILE
              value: "replace-me.archive.gz"
          command:
            - sh
            - -c
            - |
              set -e
              if [ -z "$S3_BUCKET" ]; then
                echo "S3_BUCKET not set; using local backup file"
                exit 0
              fi
              if [ -z "$S3_ENDPOINT" ]; then
                endpoint="s3.amazonaws.com"
              else
                endpoint="$S3_ENDPOINT"
              fi
              endpoint=${endpoint#https://}
              endpoint=${endpoint#http://}
              export MC_HOST_backup="https://${S3_ACCESS_KEY_ID}:${S3_SECRET_ACCESS_KEY}@${endpoint}"
              mc mb --ignore-existing backup/$S3_BUCKET
              mc cp backup/$S3_BUCKET/mongo/$RESTORE_FILE /backup/$RESTORE_FILE
          volumeMounts:
            - name: backup
              mountPath: /backup
      containers:
        - name: restore
          image: mongo:7
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: crs-app-secrets
                  key: MONGO_URI
            - name: RESTORE_FILE
              value: "replace-me.archive.gz"
          command:
            - sh
            - -c
            - |
              set -e
              if [ ! -f "/backup/$RESTORE_FILE" ]; then
                echo "Backup file not found: /backup/$RESTORE_FILE"
                exit 1
              fi
              mongorestore --uri="$MONGO_URI" --archive=/backup/$RESTORE_FILE --gzip --drop
          volumeMounts:
            - name: backup
              mountPath: /backup
